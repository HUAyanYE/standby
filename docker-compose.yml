# ============================================================
# Standby 后端服务 — Docker Compose
# ============================================================
# 架构: PostgreSQL + pgvector + Dragonfly + NATS + MinIO
# 无MongoDB — 所有数据存储在PostgreSQL
# ============================================================


services:
  # ============================================================
  # 数据层
  # ============================================================

  # PostgreSQL + pgvector (主数据库)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: standby-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-standby}
      POSTGRES_USER: ${POSTGRES_USER:-standby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD 环境变量}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standby"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dragonfly (缓存, Redis 兼容)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.25.4
    container_name: standby-dragonfly
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NATS (消息总线)
  nats:
    image: nats:2.10-alpine
    container_name: standby-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # 客户端
      - "8222:8222"   # 监控
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (对象存储 - 媒体文件)
  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: standby-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-standby}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD 环境变量}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # AI 引擎层 (Python)
  # ============================================================

  # 共鸣机制引擎
  resonance-engine:
    build:
      context: .
      dockerfile: engines/Dockerfile.python
      args:
        ENGINE_NAME: resonance_engine
    image: standby-resonance:latest
    container_name: standby-resonance
    ports:
      - "8091:8091"
    environment:
      NATS_URL: nats://nats:4222
      DB_POSTGRES: postgres://${POSTGRES_USER:-standby}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-standby}
      LOG_LEVEL: INFO
      RUST_RESONANCE_URL: http://resonance-rust:8095
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import grpc; print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 锚点生成引擎
  anchor-engine:
    build:
      context: .
      dockerfile: engines/Dockerfile.python
      args:
        ENGINE_NAME: anchor_engine
    image: standby-anchor:latest
    container_name: standby-anchor
    ports:
      - "8090:8090"
    environment:
      NATS_URL: nats://nats:4222
      DB_POSTGRES: postgres://${POSTGRES_USER:-standby}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-standby}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # 内容治理引擎
  governance-engine:
    build:
      context: .
      dockerfile: engines/Dockerfile.python
      args:
        ENGINE_NAME: governance_engine
    image: standby-governance:latest
    container_name: standby-governance
    ports:
      - "8092:8092"
    environment:
      NATS_URL: nats://nats:4222
      DB_POSTGRES: postgres://${POSTGRES_USER:-standby}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-standby}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # 情境感知引擎
  context-engine:
    build:
      context: .
      dockerfile: engines/Dockerfile.python
      args:
        ENGINE_NAME: context_engine
    image: standby-context:latest
    container_name: standby-context
    ports:
      - "8094:8094"
    environment:
      NATS_URL: nats://nats:4222
      DB_POSTGRES: postgres://${POSTGRES_USER:-standby}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-standby}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  # ============================================================
  # Rust 高性能计算服务
  # ============================================================

  # 共鸣计算服务 (SIMD + 并行优化)
  resonance-rust:
    build:
      context: .
      dockerfile: src/engines-rust/resonance-service/Dockerfile
    image: standby-resonance-rust:latest
    container_name: standby-resonance-rust
    ports:
      - "8095:8095"
    environment:
      PORT: 8095
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8095/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 治理评估服务 (规则 + 信用加权)
  governance-rust:
    build:
      context: .
      dockerfile: src/engines-rust/governance-service/Dockerfile
    image: standby-governance-rust:latest
    container_name: standby-governance-rust
    ports:
      - "8096:8096"
    environment:
      PORT: 8096
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # 网关层 (Rust/Axum)
  # ============================================================

  api-gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    image: standby-gateway:latest
    container_name: standby-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET 环境变量}
      DATABASE_URL: postgres://${POSTGRES_USER:-standby}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-standby}
      ENGINE_ANCHOR_URL: http://anchor-engine:8090
      ENGINE_RESONANCE_URL: http://resonance-engine:8091
      ENGINE_GOVERNANCE_URL: http://governance-engine:8092
      ENGINE_CONTEXT_URL: http://context-engine:8094
      RATE_LIMIT_PER_MINUTE: "60"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      anchor-engine:
        condition: service_started
      resonance-engine:
        condition: service_started
      governance-engine:
        condition: service_started
      context-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  natsdata:
  minio_data:
