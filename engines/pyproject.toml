[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standby-common"
version = "0.1.0"
description = "Standby 共享 Python 模块 — 引擎基类、数据库、NATS、Rust 客户端"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "pyyaml>=6.0",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "numpy>=1.24",
    "redis>=5.0",
    "nats-py>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
encoder = [
    "sentence-transformers>=2.2",
    "torch>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["standby_common*"]
