[package]
name = "standby-gateway"
version = "0.1.0"
edition = "2021"
description = "Standby API Gateway — REST-to-gRPC proxy with device authentication"

[[bin]]
name = "standby-gateway"
path = "src/main.rs"

[dependencies]
# HTTP 框架
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "request-id"] }

# 异步运行时
tokio = { version = "1", features = ["full"] }

# gRPC 客户端
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
prost = "0.13"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT
jsonwebtoken = "9"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# 密码学
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# 并发数据结构
dashmap = "6"

# 环境变量
dotenvy = "0.15"

# 编码
hex = "0.4"

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

[build-dependencies]
tonic-build = "0.12"
