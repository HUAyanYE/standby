[package]
name = "standby-governance-service"
version = "0.1.0"
edition = "2021"

[dependencies]
standby-governance = { path = "../governance" }
standby-shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1", features = ["derive"] }
