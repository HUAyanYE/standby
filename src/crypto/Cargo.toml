[package]
name = "standby-crypto"
version = "0.1.0"
edition = "2021"
description = "Standby E2EE 加密层 — Signal 协议 (X3DH + Double Ratchet)"

[lib]
name = "standby_crypto"
path = "src/lib.rs"

[dependencies]
# 密码学原语
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
hex = "0.4"

# 错误处理
thiserror = "1"

# 日志
tracing = "0.1"

[dev-dependencies]
rand = "0.8"
